name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # TestAppHost connects to AppDbContext.DefaultConnectionString (127.0.0.1:5432),
    # i.e. the local docker-compose Postgres when run by hand. Same major as the
    # deployed one; bump both together.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install .NET workloads
        run: dotnet workload install wasm-tools

      - name: Restore NuGet Packages
        run: dotnet restore TownHall.slnx

      - name: Build
        run: dotnet build TownHall.slnx --no-restore

      - name: Test
        run: dotnet test TownHall.slnx --no-build
